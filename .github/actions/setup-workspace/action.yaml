# action.yml
---
name: "Setup Python"
description: "Sets up Python Environment"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      shell: bash
      run: |
        uv sync --all-groups

    - name: Install Just
      uses: extractions/setup-just@v2
